<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>JIGSAW | Premier League Prediction Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"></div>
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">J</div>
      <div>
        <div class="brand-name">JIGSAW</div>
        <div class="brand-sub">Premier League Prediction Challenge</div>
      </div>
    </div>
    <div class="season-pill">2026/27</div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <div class="eyebrow">LIVE COMPETITION</div>
        <h1>Who saw it coming?</h1>
        <p>Every position matters. The lower the score, the better the prediction.</p>
      </div>
      <div class="live-card">
        <span class="live-dot"></span>
        <div>
          <strong id="statusText">Live table</strong>
          <small id="updatedText">Loading…</small>
        </div>
      </div>
    </section>

    <nav class="tabs" aria-label="Main navigation">
      <button class="tab active" data-view="overview">Leaderboard</button>
      <button class="tab" data-view="table">Premier League</button>
      <button class="tab" data-view="players">Predictions</button>
    </nav>

    <section id="overview" class="view active"></section>
    <section id="table" class="view"></section>
    <section id="players" class="view"></section>

    <footer>
      <div><strong>JIGSAW</strong> · 2026/27</div>
      <div>Scores are provisional until the final league positions are confirmed.</div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
