name: Update Premier League table

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and validate current Premier League standings
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, datetime, pathlib, re

          root=pathlib.Path(".")
          data=root/"data"
          data.mkdir(exist_ok=True)

          def load(name, default):
              p=data/name
              if not p.exists(): return default
              try: return json.loads(p.read_text())
              except: return default

          cfg=load("config.json",{})
          pred=load("predictions.json",{"season":"2026/27","players":{}})
          old=load("standings.json",{})
          hist=load("history.json",{"snapshots":[]})
          archive=load("season-archive.json",{"seasons":{}})

          now=datetime.datetime.now(datetime.timezone.utc)
          # New competition year begins on 1 August.  The current season is the
          # season whose first calendar year is the current year from 1 August,
          # otherwise previous year.
          start_year=now.year if now.month>=8 else now.year-1
          expected=f"{start_year}/{str(start_year+1)[-2:]}"

          def season_start_year(s):
              m=re.match(r"^(\d{4})",str(s))
              return int(m.group(1)) if m else start_year

          current_pred_year=season_start_year(pred.get("season",expected))
          rollover=(now.month>=8 and current_pred_year < start_year) or (now.month<8 and current_pred_year < start_year)

          token=os.environ["FOOTBALL_DATA_TOKEN"]
          req=urllib.request.Request(
              "https://api.football-data.org/v4/competitions/PL/standings",
              headers={"X-Auth-Token":token,"User-Agent":"JIGSAW-Prediction-Challenge"}
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              payload=json.load(r)

          total=[]
          for block in payload.get("standings",[]):
              if block.get("type")=="TOTAL":
                  total=block.get("table",[])
                  break
          if len(total)!=20:
              raise SystemExit(f"Expected 20 Premier League clubs, received {len(total)}")

          rows=[]
          for r in total:
              team=r.get("team",{})
              rows.append({
                  "position":r.get("position"),
                  "team":team.get("name"),
                  "played":r.get("played",0),
                  "won":r.get("won",0),
                  "drawn":r.get("draw",0),
                  "lost":r.get("lost",0),
                  "points":r.get("points",0),
                  "goalDifference":r.get("goalDifference",0),
                  "crest":team.get("crest") or team.get("crestUrl")
              })

          played=max([int(x.get("played",0) or 0) for x in rows], default=0)
          actual_season=payload.get("season",{})
          api_start=str(actual_season.get("startDate",""))[:10]
          api_end=str(actual_season.get("endDate",""))[:10]

          # If the API is already serving the new season around the 1 August
          # boundary, start a clean JIGSAW season.  Otherwise retain the current
          # prediction season.
          new_season=pred.get("season",expected)
          if api_start:
              y=int(api_start[:4])
              new_season=f"{y}/{str(y+1)[-2:]}"

          if new_season != pred.get("season"):
              # Archive only a genuinely completed prior season.
              prior=pred.get("season")
              prior_rows=old.get("standings",[])
              if prior and max([int(x.get("played",0) or 0) for x in prior_rows] or [0])>=38:
                  from copy import deepcopy
                  def final_scores(rows):
                      actual={str(x.get("team")):int(x.get("position")) for x in rows}
                      out=[]
                      for name, preds in pred.get("players",{}).items():
                          total=0
                          for p in preds:
                              a=actual.get(str(p.get("team")))
                              if a is not None: total += abs(int(p.get("position"))-a)
                          out.append({"name":name,"score":total})
                      return sorted(out,key=lambda x:(x["score"],x["name"]))
                  fr=final_scores(prior_rows)
                  archive.setdefault("seasons",{})[prior]={
                      "season":prior,
                      "winner":fr[0]["name"] if fr else None,
                      "finalScore":fr[0]["score"] if fr else None,
                      "completedAt":old.get("lastUpdated") or now.isoformat(),
                      "results":fr
                  }
                  (data/"season-archive.json").write_text(json.dumps(archive,indent=2))

              # Start the new season from the predictions file supplied by the
              # organiser.  Do not invent predictions.
              pred["season"]=new_season
              hist={"snapshots":[]}
              (data/"history.json").write_text(json.dumps(hist,indent=2))

          pre=(played==0)
          snap={"timestamp":now.isoformat(),"standings":rows}
          snaps=hist.get("snapshots",[])
          if not snaps or json.dumps(snaps[-1].get("standings",[]),sort_keys=True)!=json.dumps(rows,sort_keys=True):
              snaps.append(snap)
          hist["snapshots"]=snaps
          hist["season"]=pred.get("season",new_season)
          hist["lastUpdated"]=now.isoformat()
          (data/"history.json").write_text(json.dumps(hist,indent=2))

          out={
              "season":pred.get("season",new_season),
              "currentMatchday":actual_season.get("currentMatchday") or 0,
              "preSeason":pre,
              "finale":played>=38,
              "gamesPlayed":played,
              "lastUpdated":now.isoformat(),
              "standings":rows
          }
          (data/"standings.json").write_text(json.dumps(out,indent=2))
          (data/"predictions.json").write_text(json.dumps(pred,indent=2))
          print(f"JIGSAW updated: {out['season']} | {played}/38 games per team | {len(rows)} clubs")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update JIGSAW Premier League data"
          git push
